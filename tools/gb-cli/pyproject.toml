[project]
name = "gb-cli"
version = "0.1.0"
description = "Manage local git branches, worktrees, and multi-clone gb projects"
readme = "README.md"
authors = [
    { name = "Damian Świstowski", email = "damian@swistowski.org" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "rich>=13.9",
    "tomli-w>=1.2.0",
]

[project.scripts]
gb = "gb_cli.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
